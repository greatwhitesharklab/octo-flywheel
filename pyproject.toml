[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "octo-flywheel"
version = "0.1.0"
description = "Data-flywheel plumbing over the octo personalization lever (open glue; the moat is your accumulated data)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "octo-personalization",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["octo_flywheel*"]
